[package]
name = "auswertung-light"
version = "2.0.0"
description = "Auswertung Light – Auswertprogramm für den Kart-Slalom"
authors = ["Johannes Haseitl"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "auswertung_light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
