name: Build

# Baut die Installationspakete für Windows, macOS und Linux.
# - Push auf v2: Pakete als Artefakte am Workflow-Lauf
# - Tag wie v2.0.0 gepusht: zusätzlich Release-Entwurf mit den Paketen
# - Manueller Start mit „Release-Tag": Release-Entwurf für den gewählten Commit;
#   GitHub legt den Tag an, sobald der Entwurf veröffentlicht wird
on:
  push:
    branches: [v2]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release-Tag (z. B. v2.0.0); leer = nur bauen'
        required: false
        default: ''

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || '' }}

jobs:
  # Legt den Release-Entwurf einmal an, damit die parallelen Builds nicht
  # jeweils ein eigenes Release erzeugen.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.entwurf.outputs.id }}
    steps:
      - id: entwurf
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Ungültiger Release-Tag „$RELEASE_TAG“ (erwartet z. B. v2.0.0)"
            exit 1
          fi
          # Vorhandenen Entwurf für diesen Tag wiederverwenden (z. B. bei erneutem Lauf)
          id=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n1)
          if [ -n "$id" ]; then
            # Entwurf auf den aktuellen Commit umstellen
            gh api -X PATCH "repos/$GH_REPO/releases/$id" -f target_commitish="$GITHUB_SHA" --jq .id > /dev/null
          else
            id=$(gh api -X POST "repos/$GH_REPO/releases" \
              -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Auswertung Light $RELEASE_TAG" \
              -f body="Installationspakete für Windows, macOS und Linux. Änderungen siehe CHANGELOG.md. Die Pakete sind nicht signiert." \
              -F draft=true --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Release-Entwurf konnte nicht angelegt werden"
            exit 1
          fi
          echo "Release-ID: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: windows
            args: ''
          - platform: macos-latest
            name: macos
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            name: linux
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - name: Systempakete für Tauri (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # pnpm wird erst danach über Corepack aktiviert; der automatische pnpm-Cache würde sonst fehlschlagen.
          package-manager-cache: false
      - run: corepack enable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Ohne releaseId wird nur gebaut, kein Release befüllt.
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v6
        with:
          name: auswertung-light-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
